<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Espacio de equipo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontsource-manrope/5.0.8/index.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --bg:#12181B;
    --surface:#1B2328;
    --surface-2:#212B31;
    --surface-3:#28333A;
    --border:#2A343A;
    --text:#EDEEE9;
    --text-muted:#8B9AA0;
    --accent:#E8A33D;
    --accent-ink:#3A2A0E;
    --accent-2:#5FB3A3;
    --danger:#E2665A;
    --radius:8px;
    --radius-lg:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:16px;}
  a{color:var(--accent-2);}

  #app{display:flex;height:100vh;overflow:hidden;}

  /* --- rail --- */
  .rail{
    width:76px;flex:none;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;
    padding:16px 0;gap:6px;
  }
  .rail-logo{
    width:38px;height:38px;border-radius:11px;background:var(--accent);
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;margin-bottom:14px;
  }
  .rail-btn{
    width:56px;padding:8px 2px;border:none;background:transparent;color:var(--text-muted);
    border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:11px;font-weight:600;
  }
  .rail-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .rail-btn.active{background:var(--surface-3);color:var(--text);}
  .rail-btn:hover{color:var(--text);}
  .rail-spacer{flex:1;}
  .rail-me{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;border:2px solid var(--border);color:#12181B;cursor:pointer;
  }

  /* --- secondary panel --- */
  .side{
    width:240px;flex:none;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .side-head{padding:18px 16px 10px;}
  .side-head h1{font-size:15px;margin:0 0 8px;font-weight:800;letter-spacing:-.01em;}
  .proj-switch{display:flex;gap:6px;align-items:center;}
  .proj-switch select{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:700;
  }
  .proj-switch select:focus{outline:none;border-color:var(--accent);}
  .side-head .sub{font-size:12px;color:var(--text-muted);cursor:pointer;}
  .side-list{flex:1;overflow-y:auto;padding:6px 8px;}
  .side-item{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text-muted);
    font-size:13.5px;font-weight:600;cursor:pointer;position:relative;
  }
  .side-item:hover{background:var(--surface-2);}
  .side-item.active{background:var(--surface-3);color:var(--text);}
  .side-item .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;display:none;}
  .side-item.unread .dot{display:block;}
  .side-item.unread{color:var(--text);}
  .side-add{
    margin:8px 8px 14px;padding:8px 10px;border-radius:8px;border:1px dashed var(--border);
    background:transparent;color:var(--text-muted);font-size:12.5px;font-weight:600;text-align:left;
  }
  .side-add:hover{color:var(--text);border-color:var(--text-muted);}
  .online-strip{padding:10px 16px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted);}
  .online-strip .avatars{display:flex;margin-top:8px;}
  .mini-av{width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#12181B;border:2px solid var(--surface);margin-left:-6px;}
  .mini-av:first-child{margin-left:0;}

  /* --- main --- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:58px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;
    padding:0 20px;gap:14px;
  }
  .topbar h2{font-size:15.5px;margin:0;font-weight:800;}
  .topbar .meta{font-size:12px;color:var(--text-muted);}
  .topbar .grow{flex:1;}
  .searchbox{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;font-size:13px;color:var(--text);width:200px;
  }
  .searchbox:focus{outline:none;border-color:var(--accent);}
  .btn{
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;
  }
  .btn:hover{border-color:var(--text-muted);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-muted);padding:6px 8px;}
  .btn.ghost:hover{color:var(--text);background:var(--surface-2);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.block{width:100%;text-align:center;}
  .link-btn{background:none;border:none;color:var(--accent-2);font-size:12.5px;font-weight:700;padding:0;}
  .menu-toggle{display:none;font-size:16px;padding:8px 10px;}

  .authbg-grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(95,179,163,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(95,179,163,.06) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(ellipse at center, black 35%, transparent 78%);
            mask-image:radial-gradient(ellipse at center, black 35%, transparent 78%);
  }
  .authbg-scanline{
    position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(95,179,163,.55), transparent);
    animation:authScanline 5.5s linear infinite;
  }
  .authbg-logo-corner{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:10px;opacity:.95;}
  .authbg-logo-corner img{height:34px;width:auto;display:block;}
  .authbg-logo-corner span{font-size:12px;letter-spacing:.02em;color:var(--text-muted);font-weight:700;}
  @keyframes authScanline{ 0%{ top:-5%; } 100%{ top:105%; } }
  @media (prefers-reduced-motion: reduce){
    .authbg-scanline{ animation:none !important; }
  }

  .content{flex:1;overflow-y:auto;}

  /* --- chat --- */
  .pinned-bar{padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);display:none;}
  .pinned-bar.show{display:block;}
  .pinned-bar b{color:var(--text);}
  .pin-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;margin:4px 6px 0 0;font-size:12px;}
  .pin-chip button{background:none;border:none;color:var(--text-muted);font-size:12px;}

  .msg-list{padding:18px 22px 6px;display:flex;flex-direction:column;gap:2px;}
  .msg{display:flex;gap:12px;padding:8px 6px;border-radius:8px;position:relative;}
  .msg:hover{background:var(--surface);}
  .msg:hover .msg-tools{opacity:1;}
  .av{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#12181B;}
  .msg-body{min-width:0;flex:1;}
  .msg-head{display:flex;align-items:baseline;gap:8px;}
  .msg-author{font-weight:800;font-size:13.5px;}
  .msg-time{font-size:11px;color:var(--text-muted);}
  .msg-text{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:1px;}
  .msg-text .mention{background:rgba(232,163,61,.18);color:var(--accent);padding:0 4px;border-radius:4px;font-weight:700;}
  .msg-quote{border-left:3px solid var(--border);padding:4px 10px;margin:4px 0 6px;font-size:12.5px;color:var(--text-muted);background:var(--surface-2);border-radius:0 6px 6px 0;}
  .msg-tools{position:absolute;top:-14px;right:10px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;display:flex;opacity:0;transition:opacity .1s;}
  .msg-tools button{background:none;border:none;padding:6px 8px;color:var(--text-muted);font-size:13px;}
  .msg-tools button:hover{color:var(--text);}
  .reactions{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .reaction{
    border:1px solid var(--border);background:var(--surface-2);border-radius:12px;
    padding:2px 8px;font-size:12px;display:flex;gap:5px;align-items:center;
  }
  .reaction.mine{border-color:var(--accent);background:rgba(232,163,61,.12);}
  .reaction:hover{border-color:var(--text-muted);}
  .emoji-add{border:1px dashed var(--border);background:transparent;border-radius:12px;padding:2px 7px;font-size:12px;color:var(--text-muted);}

  .composer{border-top:1px solid var(--border);padding:14px 20px 18px;flex:none;}
  .reply-banner{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px 8px 0 0;padding:6px 12px;font-size:12px;color:var(--text-muted);}
  .reply-banner b{color:var(--text);}
  .reply-banner .grow{flex:1;}
  .composer-box{display:flex;align-items:flex-end;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 8px 8px 14px;}
  .composer-box.attached{border-radius:0 0 10px 10px;}
  .composer textarea{
    flex:1;background:transparent;border:none;color:var(--text);font-size:14px;resize:none;
    max-height:140px;line-height:1.5;padding:5px 0;
  }
  .composer textarea:focus{outline:none;}
  .emoji-quick{display:flex;gap:2px;}
  .emoji-quick button{background:none;border:none;font-size:16px;padding:5px;border-radius:6px;}
  .emoji-quick button:hover{background:var(--surface-3);}
  .mention-pop{background:var(--surface-3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden;display:none;}
  .mention-pop.show{display:block;}
  .mention-pop div{padding:7px 12px;font-size:13px;font-weight:600;}
  .mention-pop div:hover,.mention-pop div.sel{background:var(--surface-2);color:var(--accent);}

  /* --- generic content padding --- */
  .pane{padding:22px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}

  /* --- tasks --- */
  .task-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px;align-items:start;}
  .task-col h3{font-size:12.5px;color:var(--text-muted);text-transform:none;margin:0 0 10px;display:flex;justify-content:space-between;}
  .task-col-list{display:flex;flex-direction:column;gap:10px;min-height:40px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 14px;cursor:grab;}
  .card.dragging{opacity:.4;}
  .task-col-list{transition:background .1s;}
  .card-title{font-weight:700;font-size:13.5px;margin-bottom:8px;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;}
  .badge.low{background:rgba(95,179,163,.15);color:var(--accent-2);}
  .badge.med{background:rgba(232,163,61,.15);color:var(--accent);}
  .badge.high{background:rgba(226,102,90,.15);color:var(--danger);}
  .card select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:11.5px;padding:3px 6px;}
  .card .due{font-size:11.5px;color:var(--text-muted);}
  .card .team-tag{font-size:11px;color:var(--text-muted);background:var(--surface-2);border-radius:6px;padding:2px 7px;}
  .card .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
  .card .who .av{width:20px;height:20px;font-size:10px;border-radius:6px;}
  .card-goal{font-size:11px;color:var(--accent-2);margin-top:6px;}
  .card-del{background:none;border:none;color:var(--text-muted);font-size:12px;}
  .card-del:hover{color:var(--danger);}

  /* --- goals --- */
  .goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;}
  .goal-card h4{margin:0 0 4px;font-size:14.5px;}
  .goal-card .desc{font-size:12.5px;color:var(--text-muted);margin-bottom:10px;}
  .progress-track{background:var(--surface-3);height:7px;border-radius:6px;overflow:hidden;}
  .progress-fill{background:var(--accent-2);height:100%;}
  .progress-num{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
  .kr{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--border);}
  .kr input{accent-color:var(--accent-2);}
  .kr.done span{text-decoration:line-through;color:var(--text-muted);}
  .goal-meta{display:flex;gap:10px;font-size:11.5px;color:var(--text-muted);margin:10px 0;}

  /* --- calendar --- */
  .cal-wrap{display:flex;gap:20px;padding:20px;align-items:flex-start;}
  .cal-grid{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
  .cal-nav h3{margin:0;font-size:15px;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
  .cal-days div{padding:8px;text-align:center;font-size:11px;color:var(--text-muted);font-weight:700;}
  .cal-cells{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:96px;}
  .cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;font-size:11.5px;color:var(--text-muted);cursor:pointer;overflow:hidden;}
  .cal-cell:hover{background:var(--surface-2);}
  .cal-cell.today{background:rgba(232,163,61,.08);}
  .cal-cell .n{font-weight:800;color:var(--text);}
  .cal-cell.other .n{color:var(--text-muted);}
  .ev-chip{background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ev-chip-task{background:var(--surface-3);color:var(--text);}
  .ev-chip-goal{background:rgba(95,179,163,.25);color:var(--accent-2);}
  .agenda{width:270px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;}
  .agenda h3{margin:0 0 12px;font-size:13.5px;}
  .agenda-item{border-top:1px solid var(--border);padding:10px 0;}
  .agenda-item:first-child{border-top:none;padding-top:0;}
  .agenda-item .d{font-size:11px;color:var(--accent);font-weight:800;}
  .agenda-item .t{font-size:13px;font-weight:700;margin-top:2px;}
  .agenda-item .a{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  /* --- team --- */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:20px;}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;gap:12px;align-items:center;}
  .team-card .av{width:44px;height:44px;border-radius:12px;font-size:15px;}
  .team-card .name{font-weight:800;font-size:14px;}
  .team-card .status{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-top:2px;}
  .status .sdot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);}
  .status.on .sdot{background:var(--accent-2);}
  .status.on{color:var(--accent-2);}

  .empty{color:var(--text-muted);font-size:13px;padding:40px;text-align:center;}

  /* --- modal --- */
  .overlay{position:fixed;inset:0;background:rgba(6,9,10,.6);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px;}
  .modal h3{margin:0 0 6px;font-size:16px;}
  .modal .lead{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;line-height:1.5;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);font-weight:700;margin-bottom:5px;}
  .field input[type=text],.field input[type=password],.field input[type=date],.field input[type=time],.field textarea,.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 11px;font-size:13.5px;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .field .hint{font-size:11px;color:var(--text-muted);margin-top:4px;}
  .field.check{display:flex;align-items:center;gap:8px;}
  .field.check label{margin:0;font-weight:600;color:var(--text);}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;}
  .swatch.sel{border-color:var(--text);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .chip-select{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-opt{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;}
  .chip-opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .error-text{color:var(--danger);font-size:12.5px;margin:-4px 0 12px;min-height:14px;}
  .auth-switch{text-align:center;margin-top:14px;font-size:12.5px;color:var(--text-muted);}

  @media (max-width:760px){
    html, body{ height:100dvh; }
    #app{ height:100dvh; }
    .msg-tools{opacity:1;position:static;background:transparent;border:none;margin-top:4px;justify-content:flex-end;}

    /* Rail becomes a fixed bottom tab bar, like a native phone app, instead of a
       cramped vertical strip squeezed against the left edge. */
    .rail{
      position:fixed; left:0; right:0; bottom:0; top:auto; width:100%; height:58px;
      height:calc(58px + env(safe-area-inset-bottom));
      padding-bottom:env(safe-area-inset-bottom);
      flex-direction:row; padding-left:4px; padding-right:4px; padding-top:0; gap:0;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      border-top:1px solid var(--border); border-right:none; z-index:40;
      justify-content:flex-start; align-items:stretch; background:var(--surface);
    }
    .rail-logo{display:none;}
    .rail-spacer{display:none;}
    .rail-btn{
      flex:0 0 auto; width:auto; min-width:58px; padding:6px 8px; font-size:9.5px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    }
    .rail-btn svg{width:20px;height:20px;}
    #globalSearchBtn{order:-1;}
    .rail-me{width:34px;height:34px;font-size:12px;margin:auto 2px auto 6px;flex:0 0 auto;}

    main{padding-bottom:calc(58px + env(safe-area-inset-bottom));}
    #app{flex-wrap:wrap;}

    .side{position:absolute;left:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:20;width:82vw;max-width:300px;transform:translateX(-100%);transition:transform .15s;box-shadow:8px 0 24px rgba(0,0,0,.4);}
    .side.show{transform:translateX(0);}
    .menu-toggle{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:38px;}
    .topbar{padding:0 12px;gap:8px;height:52px;}
    .topbar h2{font-size:14px;}
    .searchbox{width:120px;}
    .task-cols{grid-template-columns:1fr;padding:14px;}
    .cal-wrap{flex-direction:column;padding:14px;}
    .agenda{width:100%;}
    .grid-cards{grid-template-columns:1fr!important;}
    .pane{padding:14px;}
    .msg-list{padding:12px 12px 6px;}
    .composer{padding:10px 12px 14px;}
    .modal{width:94vw;padding:16px;max-height:80dvh;}
    .overlay{align-items:flex-end;}
    .overlay .modal{border-radius:16px 16px 0 0;width:100%;max-width:100%;}
    .cal-cells{grid-auto-rows:64px;}
    .cal-cell{padding:3px;font-size:9.5px;}
    .cal-cell .n{font-size:11px;}
    .ev-chip{font-size:8.5px;padding:0 3px;margin-top:1px;}
    .cal-days div{padding:5px;font-size:9.5px;}

    /* iOS Safari auto-zooms on focus if a field's font is under 16px — force 16px here
       regardless of what more specific rules elsewhere set, so typing never triggers it. */
    input, textarea, select{ font-size:16px !important; }

    /* touch targets */
    .btn{min-height:40px;}
    .side-item{min-height:44px;}
    .card-del, .link-btn{padding:6px 2px;}
    .swatch{width:36px;height:36px;}
    .chip-opt{padding:8px 14px;}
  }
  @media (max-width:420px){
    .rail-btn{font-size:9px;min-width:52px;}
    .searchbox{width:90px;font-size:12px;}
    .topbar h2{font-size:13px;}
  }

  /* On very wide desktop monitors, keep reading/working widths comfortable instead of
     letting text and cards stretch edge-to-edge. */
  @media (min-width:1500px){
    .pane, .task-cols, .cal-wrap{max-width:1400px;margin:0 auto;}
    .msg-list{max-width:1100px;margin:0 auto;width:100%;}
    .composer{max-width:1100px;margin:0 auto;}
  }
</style>
</head>

const EMAILJS_PUBLIC_KEY = "QZe8kSc6A8zZkW_u2";

try{ emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); }catch(e){ console.error('emailjs init error', e); }
async function sendEmailNotification(toEmail, toName, title, message){
  if(!toEmail) return;
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: toEmail,
      to_name: toName || 'equipo',
      title: title,
      message: message,
      name: 'Espacio de equipo'
    });
  }catch(e){ console.error('email notification error', e); }
}
function emailFor(name){
  const r = roster.find(x=>x.name===name);
  return r?.email || null;
}
async function notifyTaskAssignment(task){
  const names = [task.assignee, ...(task.members||[])].filter(Boolean);
  const uniqueNames = [...new Set(names)];
  for(const name of uniqueNames){
    const email = emailFor(name);
    if(!email || name===me.name) continue;
    await sendEmailNotification(
      email, name,
      `Te asignaron una tarea: ${task.title}`,
      `${me.name} te asignó la tarea "${task.title}"${task.due? ` (fecha límite: ${task.due})`:''} en el proyecto "${currentProject()?.name||''}".`
    );
  }
}
async function notifyNewEvent(event){
  let recipients = [];
  if(event.attendees && event.attendees.length){
    recipients = event.attendees.map(name=>({name, email:emailFor(name)})).filter(r=>r.email);
  } else {
    recipients = projectMembers(currentProject()).filter(r=>r.email).map(r=>({name:r.name, email:r.email}));
  }
  for(const r of recipients){
    if(r.name===me.name) continue;
    await sendEmailNotification(
      r.email, r.name,
      `Nuevo evento: ${event.title}`,
      `${me.name} agregó el evento "${event.title}" el ${event.date}${event.time? ` a las ${event.time}`:''} en el proyecto "${currentProject()?.name||''}".`
    );
  }
}
async function sGet(key, shared, fallback){
  if(!shared){
    try{
      const raw = localStorage.getItem('personal:'+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if(!res.ok) return fallback;
    const rows = await res.json();
    if(!rows.length) return fallback;
    return JSON.parse(rows[0].value);
  }catch(e){ return fallback; }
}
async function sSet(key, value, shared, quiet){
  if(!shared){
    try{ localStorage.setItem('personal:'+key, JSON.stringify(value)); return true; }
    catch(e){ if(!quiet) console.error("storage error", key, e); return false; }
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ key, value: JSON.stringify(value) })
    });
    if(!res.ok){ if(!quiet) console.error("storage error", key, res.status); return false; }
    return true;
  }catch(e){ if(!quiet) console.error("storage error", key, e); return false; }
}
/* For steps where silently failing would corrupt trust (account creation, crypto setup):
   retry a few times with backoff, and let the caller know for sure whether it actually saved. */
async function sSetCritical(key, value, shared, retries){
  retries = retries===undefined ? 3 : retries;
  for(let i=0;i<=retries;i++){
    const ok = await sSet(key, value, shared, true);
    if(ok) return true;
    await new Promise(res=>setTimeout(res, 400*(i+1)));
  }
  return false;
}

/* ---------------- crypto helpers ---------------- */
function bytesToHex(bytes){ return [...bytes].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(hex){ const a=new Uint8Array(hex.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(hex.substr(i*2,2),16); return a; }
function bytesToB64(bytes){ return btoa(String.fromCharCode(...bytes)); }
function b64ToBytes(b64){ return new Uint8Array(atob(b64).split('').map(c=>c.charCodeAt(0))); }
function randHex(len){ const a=new Uint8Array(len); crypto.getRandomValues(a); return bytesToHex(a); }

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return bytesToHex(new Uint8Array(buf));
}
async function hashPassword(password, saltHex){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:hexToBytes(saltHex), iterations:150000, hash:'SHA-256'}, km, 256);
  return bytesToHex(new Uint8Array(bits));
}
async function legacyHashPassword(password, saltHex){ return sha256Hex('pw:'+saltHex+':'+password); }
async function verifyPassword(password, acc){
  const newHash = await hashPassword(password, acc.saltHex);
  if(newHash === acc.hash) return true;
  const oldHash = await legacyHashPassword(password, acc.saltHex);
  return oldHash === acc.hash; // legacy accounts created before the security upgrade
}

/* login attempt throttling */
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 15*60*1000;
async function isLockedOut(username){
  const attempts = await sGet('loginAttempts', true, {});
  const rec = attempts[username];
  if(rec && (Date.now()-rec.firstAt)<LOCKOUT_MS && rec.count>=MAX_ATTEMPTS){
    return {locked:true, mins: Math.ceil((LOCKOUT_MS-(Date.now()-rec.firstAt))/60000)};
  }
  return {locked:false};
}
async function checkAndRegisterAttempt(username, success){
  const attempts = await sGet('loginAttempts', true, {});
  const rec = attempts[username];
  if(success){
    if(rec){ delete attempts[username]; await sSet('loginAttempts', attempts, true, true); }
    return {ok:true};
  }
  const now = Date.now();
  if(rec && (now-rec.firstAt)<LOCKOUT_MS && rec.count>=MAX_ATTEMPTS){
    const mins = Math.ceil((LOCKOUT_MS-(now-rec.firstAt))/60000);
    return {ok:false, locked:true, mins};
  }
  if(!rec || (now-rec.firstAt)>=LOCKOUT_MS){ attempts[username] = {count:1, firstAt:now}; }
  else { attempts[username].count++; }
  await sSet('loginAttempts', attempts, true, true);
  const remaining = MAX_ATTEMPTS - attempts[username].count;
  return {ok:true, remaining};
}

/* escrow: lets someone recover the workspace passphrase using their own account password */
async function deriveEscrowKey(password, saltHex){ return deriveAesKey(password+':escrow', saltHex); }
async function saveEscrow(username, password, saltHex, phrase){
  const escrow = await sGet('escrow', true, {});
  const ekey = await deriveEscrowKey(password, saltHex);
  escrow[username] = await encStr(phrase, ekey);
  await sSet('escrow', escrow, true);
}
async function recoverPhraseFromEscrow(username, password){
  const acc = accounts[username];
  if(!acc) return null;
  const escrow = await sGet('escrow', true, {});
  if(!escrow[username]) return null;
  try{
    const ekey = await deriveEscrowKey(password, acc.saltHex);
    return await decStr(escrow[username], ekey);
  }catch(e){ return null; }
}

async function deriveAesKey(passphrase, saltHex){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:hexToBytes(saltHex), iterations:100000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encStr(text, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
  return bytesToB64(iv)+'.'+bytesToB64(new Uint8Array(ct));
}
async function decStr(payload, key){
  const [ivB64, ctB64] = payload.split('.');
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(ivB64)}, key, b64ToBytes(ctB64));
  return new TextDecoder().decode(buf);
}

/* protected (encrypted) shared storage — needs sessionKey */
let sessionKey = null;
let recentWrites = {}; // key -> timestamp of last successful local write, to avoid the poll loop clobbering it
async function pGet(key, fallback){
  const raw = await sGet(key, true, null);
  if(!raw) return fallback;
  try{ return JSON.parse(await decStr(raw, sessionKey)); }
  catch(e){ return fallback; }
}
async function pSet(key, value){
  const enc = await encStr(JSON.stringify(value), sessionKey);
  const ok = await sSet(key, enc, true);
  if(ok) recentWrites[key] = Date.now();
  return ok;
}
async function pSetCritical(key, value, retries){
  const enc = await encStr(JSON.stringify(value), sessionKey);
  const ok = await sSetCritical(key, enc, true, retries);
  if(ok) recentWrites[key] = Date.now();
  return ok;
}
/* Skip re-fetching a key in the poll loop right after we wrote it locally — the storage
   backend can take a few seconds to catch up, and re-fetching too soon can overwrite the
   change the person just made with a stale copy. */
async function pGetFresh(key, currentValue, fallback, graceMs){
  graceMs = graceMs===undefined ? 6000 : graceMs;
  if(recentWrites[key] && (Date.now()-recentWrites[key]) < graceMs) return currentValue;
  return await pGet(key, fallback===undefined ? currentValue : fallback);
}
async function pSetChecked(key, value, actionLabel){
  const ok = await pSet(key, value);
  if(!ok){
    alert('No se pudo guardar ('+actionLabel+'): se alcanzó el límite de almacenamiento para esta lista (5 MB). Exporta un respaldo y libera espacio — por ejemplo archivando mensajes antiguos o eliminando tareas/metas ya completadas.');
  }
  return ok;
}
async function logActivity(action, details, projectId){
  try{
    let log = await pGet('auditLog', []);
    log.push({id:uid(), ts:Date.now(), user:me.name, action, details, projectId: projectId===undefined ? currentProjectId : projectId});
    if(log.length>500) log = log.slice(log.length-500);
    await pSet('auditLog', log);
  }catch(e){ /* never block the main action if logging fails */ }
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("");
}
function colorFor(name){
  const m = roster.find(r=>r.name===name);
  if(m) return m.color;
  let h=0; for(const c of (name||"")) h = (h*31 + c.charCodeAt(0))>>>0;
  return PALETTE[h % PALETTE.length];
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateShort(ts){ return new Date(ts).toLocaleDateString('es',{day:'2-digit',month:'short'}); }
function isToday(d){ const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
function isOnline(name){ const ts = presence[name]; return ts && (Date.now()-ts) < ONLINE_WINDOW; }

function applyFormatting(escapedText){
  let out = escapedText;
  out = out.replace(/```([\s\S]+?)```/g, (m,code)=>`<pre style="background:var(--surface-3);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px;margin:4px 0"><code>${code}</code></pre>`);
  out = out.replace(/`([^`\n]+?)`/g, (m,code)=>`<code style="background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:12.5px">${code}</code>`);
  out = out.replace(/\*\*([^\n*]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^\n*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/(^|\n)- (.+)/g, '$1• $2');
  return out;
}
function linkifyAndMention(text){
  let out = esc(text);
  out = applyFormatting(out);
  out = out.replace(/(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" rel="noopener">${url.replace(/^https?:\/\//,'')}</a>`);
  const names = roster.map(r=>r.name).sort((a,b)=>b.length-a.length);
  for(const n of names){
    if(!n) continue;
    const re = new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    out = out.replace(re, m => `<span class="mention">${m}</span>`);
  }
  return out;
}
function wrapSelection(textarea, before, after){
  const start = textarea.selectionStart, end = textarea.selectionEnd;
  const val = textarea.value;
  const selected = val.slice(start,end) || 'texto';
  textarea.value = val.slice(0,start) + before + selected + after + val.slice(end);
  textarea.focus();
  textarea.selectionStart = start + before.length;
  textarea.selectionEnd = start + before.length + selected.length;
}

/* Reading whether accounts already exist is the single most dangerous read in the app:
   if a transient failure makes it look empty, "first setup" will overwrite real data.
   Retry hard, and if it still fails, refuse to guess — block instead of risking data loss. */
async function sGetCriticalRead(key, shared, retries){
  retries = retries===undefined ? 7 : retries;
  for(let i=0;i<=retries;i++){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const rows = await res.json();
      return {ok:true, value: rows.length ? JSON.parse(rows[0].value) : null};
    }catch(e){
      if(i===retries) return {ok:false};
      await new Promise(res=>setTimeout(res, 700*(i+1)));
    }
  }
}
async function init(){
  const accountsRead = await sGetCriticalRead('accounts', true);
  if(!accountsRead.ok){
    renderStorageBlockedScreen();
    return;
  }
  accounts = accountsRead.value || {};
  cryptoSalt = await sGet('cryptoSalt', true, null);
  inviteSalt = await sGet('inviteSalt', true, null);
  inviteHash = await sGet('inviteHash', true, null);
  device = await sGet('device', false, null);
  renderAuthShell();
  openAuthModal();
}

function startBackgroundLoops(){
  if(pollingStarted) return;
  pollingStarted = true;
  setInterval(pollLoop, POLL_MS);
  setInterval(heartbeat, HEARTBEAT_MS);
}

async function ensureRoster(){
  roster = await pGetFresh('roster', roster, []);
  const myEmail = accounts[currentUsername]?.email || '';
  const existing = roster.find(r=>r.name===me.name);
  if(!existing){
    roster.push({name:me.name,color:me.color,username:currentUsername,email:myEmail});
    await pSet('roster', roster);
  } else {
    let changed = false;
    if(!existing.username){ existing.username = currentUsername; changed = true; }
    if(existing.email!==myEmail){ existing.email = myEmail; changed = true; }
    if(changed) await pSet('roster', roster);
  }
}
async function heartbeat(){
  if(!me || !sessionKey) return;
  presence = await sGet('presence', true, {});
  presence[me.name] = Date.now();
  await sSet('presence', presence, true, true); // quiet: transient failures here are harmless
}
let pollInFlight = false;
async function pollLoop(){
  if(!me || !sessionKey) return;
  if(pollInFlight) return; // never let two sync cycles overlap and race each other
  // Skip the whole cycle — not just the render — while a message box is focused. No fetching,
  // no rendering, nothing touches the screen until the person clicks away or sends.
  const activeEl = document.activeElement;
  if(activeEl && (activeEl.id==='msgInput' || activeEl.id==='dmInput')) return;
  pollInFlight = true;
  try{
    presence = await sGet('presence', true, {});
    roster = await pGetFresh('roster', roster);
    projects = await pGetFresh('projects', projects);
    channels = await pGetFresh('channels', channels);
    for(const c of channels){
      const msgs = await pGetFresh('messages:'+c.id, messagesCache[c.id]||[], []);
      checkForNotifications(c, msgs);
      messagesCache[c.id] = msgs;
    }
    for(const r of roster){
      if(r.username && r.username!==currentUsername){
        await loadDM(r.username, true);
      }
    }
    const eventUpdates = await pGetFresh('eventUpdates', [], []);
    checkForEventNotifications(eventUpdates);
    notificationsBootstrapped = true;
    tasks = await pGetFresh('tasks', tasks);
    goals = await pGetFresh('goals', goals);
    events = await pGetFresh('events', events);

    // Re-check right before touching the screen — typing may have started during the fetches above.
    const activeElNow = document.activeElement;
    if(activeElNow && (activeElNow.id==='msgInput' || activeElNow.id==='dmInput')) return;

    renderMain(true);
    renderSideOnly();
  } finally {
    pollInFlight = false;
  }
}
function dmKeyFor(otherUsername){
  return 'dm:' + [currentUsername, otherUsername].sort().join('__');
}
async function loadDM(otherUsername, silent){
  const key = dmKeyFor(otherUsername);
  const msgs = silent ? await pGetFresh(key, dmCache[otherUsername]||[], []) : await pGet(key, []);
  checkForDMNotifications(otherUsername, msgs);
  dmCache[otherUsername] = msgs;
  if(!silent) renderMain();
}
function checkForDMNotifications(otherUsername, msgs){
  msgs.forEach(m=>{
    if(notifiedIds.has(m.id)) return;
    notifiedIds.add(m.id);
    if(!notificationsBootstrapped) return;
    if(m.from===me.name) return;
    showBrowserNotification(`💬 ${m.from}`, m.text.slice(0,100));
  });
}
async function logEventUpdate(event, action){
  try{
    let updates = await pGet('eventUpdates', []);
    updates.push({
      id:uid(), ts:Date.now(), eventId:event.id, title:event.title, date:event.date,
      action, editor:me.name, projectId:event.projectId,
      attendeeNames: (event.attendees && event.attendees.length) ? event.attendees : null
    });
    if(updates.length>200) updates = updates.slice(updates.length-200);
    await pSet('eventUpdates', updates);
  }catch(e){ /* notification bookkeeping should never block the save itself */ }
}
function checkForEventNotifications(updates){
  updates.forEach(u=>{
    if(notifiedIds.has(u.id)) return;
    notifiedIds.add(u.id);
    if(!notificationsBootstrapped) return;
    if(u.editor===me.name) return;
    const inMyProjects = myProjects().some(p=>p.id===u.projectId);
    if(!inMyProjects) return;
    const targeted = u.attendeeNames===null || u.attendeeNames.includes(me.name);
    if(!targeted) return;
    const verb = u.action==='created' ? 'Nuevo evento' : 'Evento actualizado';
    showBrowserNotification(`📅 ${verb}: ${u.title}`, `${u.editor} · ${u.date}`);
  });
}
function checkForNotifications(channel, msgs){
  msgs.forEach(m=>{
    if(notifiedIds.has(m.id)) return;
    notifiedIds.add(m.id);
    if(!notificationsBootstrapped) return; // don't notify about history on first load
    if(m.author===me.name) return;
    const mentioned = me && new RegExp('@'+me.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(m.text);
    const title = mentioned ? `🔔 Te mencionaron en #${channel.name}` : `#${channel.name} · ${m.author}`;
    showBrowserNotification(title, `${m.author}: ${m.text.slice(0,100)}`);
  });
}
function showBrowserNotification(title, body){
  if(!notificationsEnabled) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification(title, {body}); }catch(e){}
}
async function enableBrowserNotifications(){
  if(!('Notification' in window)){ alert('Tu navegador no soporta notificaciones.'); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    notificationsEnabled = true;
    alert('Notificaciones activadas. Solo funcionan mientras esta pestaña siga abierta (aunque esté en segundo plano) — no llegan si cierras la pestaña o el navegador.');
  } else {
    alert('No se activaron: el permiso fue denegado o ya estaba bloqueado en la configuración del navegador.');
  }
}

      <div class="field"><label>Frase de cifrado del espacio</label><input type="password" id="aPhrase" placeholder="Pídesela a un compañero"></div>
      <div class="field"><label>Código de invitación</label><input type="text" id="aInvite" placeholder="Te lo entrega el administrador"></div>
      <div class="field check"><input type="checkbox" id="aRemember"><label for="aRemember">Recordar frase de cifrado en este dispositivo</label></div>
      <div class="error-text" id="aError"></div>
      <div class="modal-actions"><button class="btn primary block" id="aSubmit">Crear cuenta y entrar</button></div>
      <div class="auth-switch">¿Ya tienes cuenta? <button class="link-btn" id="toLogin">Iniciar sesión</button></div>
    `;
  }

  function wireCommon(){
    const sw = document.getElementById('aSwatches');
    if(sw){
      sw.innerHTML = PALETTE.map((c,i)=>`<div class="swatch ${i===0?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');
      sw.querySelectorAll('.swatch').forEach(el=>el.addEventListener('click',()=>{
        sw.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
        el.classList.add('sel');
      }));
    }
  }
  function pickedColor(){
    const sel = document.querySelector('#aSwatches .swatch.sel');
    return sel ? sel.dataset.c : PALETTE[0];
  }
  function showErr(msg){ const e=document.getElementById('aError'); if(e) e.textContent = msg; }

  function wireFirstSetup(){
    document.getElementById('aSubmit').addEventListener('click', async ()=>{
      const name = document.getElementById('aName').value.trim();
      const user = document.getElementById('aUser').value.trim().toLowerCase();
      const pass = document.getElementById('aPass').value;
      const pass2 = document.getElementById('aPass2').value;
      const phrase = document.getElementById('aPhrase').value;
      const phrase2 = document.getElementById('aPhrase2').value;
      const invite = document.getElementById('aInvite').value;
      const invite2 = document.getElementById('aInvite2').value;
      const remember = document.getElementById('aRemember').checked;
      if(!name || !user || !pass || !phrase || !invite) return showErr('Completa todos los campos.');
      if(pass !== pass2) return showErr('Las contraseñas no coinciden.');
      if(phrase !== phrase2) return showErr('Las frases de cifrado no coinciden.');
      if(phrase.length < 6) return showErr('Usa una frase de cifrado de al menos 6 caracteres.');
      if(invite !== invite2) return showErr('Los códigos de invitación no coinciden.');
      if(invite.length < 4) return showErr('Usa un código de invitación de al menos 4 caracteres.');
      showErr('');
      const submitBtn = document.getElementById('aSubmit');
      submitBtn.disabled = true; submitBtn.textContent = 'Guardando...';
      const saltHex = randHex(16);
      const hash = await hashPassword(pass, saltHex);
      accounts = {[user]: {saltHex, hash, displayName:name, email:document.getElementById('aEmail').value.trim(), color:pickedColor(), isAdmin:true, isMaster:true, status:'approved'}};
      if(!(await sSetCritical('accounts', accounts, true))){
        submitBtn.disabled = false; submitBtn.textContent = 'Crear espacio y entrar';
        return showErr('No se pudo guardar tu cuenta por un problema temporal de conexión. Espera unos segundos y vuelve a intentar — no cierres ni recargues la página todavía.');
      }
      cryptoSalt = randHex(16);
      if(!(await sSetCritical('cryptoSalt', cryptoSalt, true))){
        submitBtn.disabled = false; submitBtn.textContent = 'Crear espacio y entrar';
        return showErr('No se pudo guardar la configuración de cifrado. Espera unos segundos y vuelve a intentar — no cierres ni recargues la página todavía.');
      }
      inviteSalt = randHex(16);
      inviteHash = await sha256Hex('inv:'+inviteSalt+':'+invite);
      if(!(await sSetCritical('inviteSalt', inviteSalt, true)) || !(await sSetCritical('inviteHash', inviteHash, true))){
        submitBtn.disabled = false; submitBtn.textContent = 'Crear espacio y entrar';
        return showErr('No se pudo guardar el código de invitación. Espera unos segundos y vuelve a intentar — no cierres ni recargues la página todavía.');
      }
      sessionKey = await deriveAesKey(phrase, cryptoSalt);
      await saveEscrow(user, pass, saltHex, phrase);
      if(remember) { device = {username:user, passphrase:phrase}; await sSet('device', device, false); }
      currentUsername = user; currentPassphrase = phrase; isAdmin = true; isMaster = true;
      me = {name, color:pickedColor()};
      await onLoggedIn();
    });
  }

  function wireLogin(){
    document.getElementById('toRegister').addEventListener('click', ()=>{ regMode = true; renderAuthForm(); });
    document.getElementById('recoverPhraseBtn').addEventListener('click', async ()=>{
      const user = document.getElementById('aUser').value.trim().toLowerCase();
      const pass = document.getElementById('aPass').value;
      const acc = accounts[user];
      if(!acc) return showErr('Escribe primero tu usuario.');
      const ok = await verifyPassword(pass, acc);
      if(!ok) return showErr('Escribe primero tu contraseña correcta; la necesito para descifrar la frase guardada.');
      const phrase = await recoverPhraseFromEscrow(user, pass);
      if(!phrase) return showErr('No hay una frase guardada para recuperar en esta cuenta. Pídesela a un compañero.');
      document.getElementById('aPhrase').value = phrase;
      showErr('');
      alert('Frase recuperada y rellenada en el campo. Tu frase de cifrado es:\n\n'+phrase+'\n\nGuárdala en un lugar seguro.');
    });
    document.getElementById('aSubmit').addEventListener('click', async ()=>{
      const user = document.getElementById('aUser').value.trim().toLowerCase();
      const pass = document.getElementById('aPass').value;
      const phrase = document.getElementById('aPhrase').value;
      const remember = document.getElementById('aRemember').checked;
      accounts = await sGet('accounts', true, accounts);
      const acc = accounts[user];
      if(!acc) return showErr('No existe esa cuenta.');
      const preLock = await isLockedOut(user);
      if(preLock.locked) return showErr(`Demasiados intentos fallidos. Espera ${preLock.mins} minuto(s) e intenta de nuevo.`);
      const validPass = await verifyPassword(pass, acc);
      if(!validPass){
        const attemptCheck = await checkAndRegisterAttempt(user, false);
        if(!attemptCheck.ok) return showErr(`Demasiados intentos fallidos. Espera ${attemptCheck.mins} minuto(s) e intenta de nuevo.`);
        return showErr('Usuario o contraseña incorrectos.'+(attemptCheck.remaining<=2? ` (${attemptCheck.remaining} intento(s) restante(s) antes del bloqueo temporal)`:''));
      }
      await checkAndRegisterAttempt(user, true);
      if(acc.status === 'pending') return showErr('Tu cuenta todavía no ha sido aprobada por un administrador o el master del espacio.');
      if(!phrase) return showErr('Ingresa la frase de cifrado del equipo, o recupérala con el enlace de arriba.');
      showErr('');
      const key = await deriveAesKey(phrase, cryptoSalt);
      const raw = await sGet('channels', true, null);
      if(raw){
        try{ await decStr(raw, key); }
        catch(e){ return showErr('Frase de cifrado incorrecta.'); }
      }
      sessionKey = key;
      const legacyStillInUse = acc.hash !== await hashPassword(pass, acc.saltHex);
      if(legacyStillInUse){
        accounts = await sGet('accounts', true, accounts);
        accounts[user].hash = await hashPassword(pass, acc.saltHex);
        await sSet('accounts', accounts, true);
      }
      if(remember){ device = {username:user, passphrase:phrase}; await sSet('device', device, false); }
      else { device = null; await sSet('device', null, false); }
      currentUsername = user; currentPassphrase = phrase; isAdmin = !!acc.isAdmin; isMaster = !!acc.isMaster;
      await saveEscrow(user, pass, acc.saltHex, phrase);
      me = {name:acc.displayName, color:acc.color};
      await onLoggedIn();
    });
  }

  function wireRegister(){
    const backLink = document.getElementById('toLogin');
    if(backLink) backLink.addEventListener('click', ()=>{ regMode = false; renderAuthForm(); });
    document.getElementById('aSubmit').addEventListener('click', async ()=>{
      const name = document.getElementById('aName').value.trim();
      const user = document.getElementById('aUser').value.trim().toLowerCase();
      const pass = document.getElementById('aPass').value;
      const pass2 = document.getElementById('aPass2').value;
      const phrase = document.getElementById('aPhrase').value;
      const invite = document.getElementById('aInvite').value;
      const remember = document.getElementById('aRemember').checked;
      if(!name || !user || !pass || !phrase || !invite) return showErr('Completa todos los campos.');
      if(pass !== pass2) return showErr('Las contraseñas no coinciden.');
      accounts = await sGet('accounts', true, accounts);
      if(accounts[user]) return showErr('Ese usuario ya existe.');
      inviteSalt = await sGet('inviteSalt', true, inviteSalt);
      inviteHash = await sGet('inviteHash', true, inviteHash);
      const testInviteHash = await sha256Hex('inv:'+inviteSalt+':'+invite);
      if(testInviteHash !== inviteHash) return showErr('Código de invitación incorrecto.');
      showErr('');
      const key = await deriveAesKey(phrase, cryptoSalt);
      const raw = await sGet('channels', true, null);
      if(raw){
        try{ await decStr(raw, key); }
        catch(e){ return showErr('Frase de cifrado incorrecta.'); }
      }
      const saltHex = randHex(16);
      const hash = await hashPassword(pass, saltHex);
      accounts[user] = {saltHex, hash, displayName:name, email:document.getElementById('aEmail').value.trim(), color:pickedColor(), isAdmin:false, isMaster:false, status:'pending'};
      const submitBtn = document.getElementById('aSubmit');
      submitBtn.disabled = true; submitBtn.textContent = 'Guardando...';
      if(!(await sSetCritical('accounts', accounts, true))){
        submitBtn.disabled = false; submitBtn.textContent = 'Crear cuenta y entrar';
        return showErr('No se pudo guardar tu cuenta por un problema temporal de conexión. Espera unos segundos y vuelve a intentar.');
      }
      await saveEscrow(user, pass, saltHex, phrase);
      regMode = false;
      renderAuthForm();
      alert('Tu cuenta se creó correctamente. Un administrador o el master del espacio debe aprobarla antes de que puedas entrar — avísale que ya te registraste.');
    });
  }
}

async function onLoggedIn(){
  await ensureRoster();
  projects = await pGet('projects', []);
  channels = await pGet('channels', []);
  tasks = await pGet('tasks', []);
  goals = await pGet('goals', []);
  events = await pGet('events', []);
  if(projects.length===0){
    const generalId = uid();
    projects = [{id:generalId, name:'General', description:'Espacio compartido para todo el equipo', isGeneral:true, members:[], createdBy:me.name, createdAt:Date.now()}];
    channels.forEach(c=>{ if(!c.projectId) c.projectId = generalId; });
    tasks.forEach(t=>{ if(!t.projectId) t.projectId = generalId; });
    goals.forEach(g=>{ if(!g.projectId) g.projectId = generalId; });
    events.forEach(e=>{ if(!e.projectId) e.projectId = generalId; });
    const okAll = [
      await pSetCritical('projects', projects),
      await pSetCritical('channels', channels),
      await pSetCritical('tasks', tasks),
      await pSetCritical('goals', goals),
      await pSetCritical('events', events),
    ].every(Boolean);
    if(!okAll){
      alert('Hubo un problema de conexión guardando la configuración inicial de proyectos. Por favor recarga la página e inicia sesión de nuevo antes de seguir usando la app.');
    }
  }
  const accessible = myProjects();
  const general = projects.find(p=>p.isGeneral);
  currentProjectId = (general && accessible.some(p=>p.id===general.id)) ? general.id : (accessible[0]?.id || null);
  if(channels.filter(c=>c.projectId===currentProjectId).length===0 && currentProjectId){
    const ch = {id:uid(), name:'general', projectId:currentProjectId};
    channels.push(ch);
    await pSetCritical('channels', channels);
  }
  currentChannelId = channels.find(c=>c.projectId===currentProjectId)?.id || null;
  workspaceName = await pGet('workspaceName', "Espacio de equipo");
  reads = await sGet('reads', false, {});
  presence = await sGet('presence', true, {});

  closeModal();
  renderShell();
  if(currentChannelId) await loadChannelMessages(currentChannelId);
  heartbeat();
  startBackgroundLoops();
}

function myProjects(){
  return projects.filter(p=>p.isGeneral || isAdmin || (p.members||[]).includes(currentUsername));
}
function projectMembers(project){
  if(!project) return [];
  if(project.isGeneral) return roster;
  return roster.filter(r=>(project.members||[]).includes(r.username));
}
async function switchProject(projectId){
  currentProjectId = projectId;
  currentDMWith = null;
  const ch = channels.find(c=>c.projectId===currentProjectId);
  currentChannelId = ch?.id || null;
  if(currentChannelId) await loadChannelMessages(currentChannelId);
  renderShell();
  renderMain();
}

function openPendingApprovalsModal(){

  const html = `

      `).join('') : '<div class="empty">No hay cuentas pendientes.</div>'}
    </div>
    <div class="modal-actions"><button class="btn ghost" id="pendClose">Cerrar</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('pendClose').addEventListener('click', closeModal);
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', async ()=>{
    const u = b.dataset.approve;
    accounts = await sGet('accounts', true, accounts);
    accounts[u].status = 'approved';
    await sSet('accounts', accounts, true);
    // Add them to the roster immediately so they're assignable to tasks/goals/events
    // right away, instead of only after their first personal login.
    roster = await pGetFresh('roster', roster);
    if(!roster.find(r=>r.username===u)){
      roster.push({name:accounts[u].displayName, color:accounts[u].color, username:u, email:accounts[u].email||''});
      await pSet('roster', roster);
    }
    logActivity('admin_aprobacion', `Aprobó el acceso de ${accounts[u].displayName}`, null);
    openPendingApprovalsModal();
  }));
  document.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click', async ()=>{
    const u = b.dataset.reject;

  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('icCancel').addEventListener('click', closeModal);
  document.getElementById('icSave').addEventListener('click', async ()=>{
    const c1 = document.getElementById('icCode').value, c2 = document.getElementById('icCode2').value;
    if(!c1 || c1.length<4) return document.getElementById('icError').textContent='Usa al menos 4 caracteres.';
    if(c1!==c2) return document.getElementById('icError').textContent='No coinciden.';
    const prevSalt = inviteSalt, prevHash = inviteHash;
    inviteSalt = randHex(16);
    inviteHash = await sha256Hex('inv:'+inviteSalt+':'+c1);
    const ok1 = await sSetCritical('inviteSalt', inviteSalt, true);
    const ok2 = ok1 && await sSetCritical('inviteHash', inviteHash, true);
    if(!ok1 || !ok2){
      if(ok1 && !ok2){ await sSetCritical('inviteSalt', prevSalt, true); } // roll back so salt/hash stay matched
      inviteSalt = prevSalt; inviteHash = prevHash;
      document.getElementById('icError').textContent = 'No se pudo guardar por un problema de conexión. El código anterior sigue siendo válido — intenta de nuevo.';
      return;
    }
    closeModal();
    logActivity('admin_codigo_invitacion', `Cambió el código de invitación del espacio`, null);
    alert('Código de invitación actualizado.');
  });
}

async function openStorageModal(){
  const CAP = 5*1024*1024;
  const items = [];
  const chs = await pGet('channels', channels);
  for(const c of chs){
    const raw = await sGet('messages:'+c.id, true, null);
    const proj = projects.find(p=>p.id===c.projectId);
    items.push({label:`#${c.name} (${proj?.name||'?'})`, bytes:(raw||'').length, key:'messages:'+c.id, channelId:c.id});
  }
  const otherKeys = [['tasks','Tareas'],['goals','Metas'],['events','Eventos'],['roster','Equipo'],['projects','Proyectos'],['auditLog','Actividad']];
  for(const [key,label] of otherKeys){
    const raw = await sGet(key, true, null);
    items.push({label, bytes:(raw||'').length, key});
  }
  items.sort((a,b)=>b.bytes-a.bytes);
  const html = `
    <h3>Uso de almacenamiento</h3>
    <div class="lead">Cada lista tiene un límite de 5 MB. Si algo se acerca al límite, archiva mensajes antiguos o elimina contenido que ya no necesites.</div>
    ${items.map(it=>{
      const pct = Math.min(100, Math.round(it.bytes/CAP*100));
      return `<div style="margin-bottom:10px">
        <div class="card-row" style="margin:0"><span style="font-size:12.5px;font-weight:700">${esc(it.label)}</span><span style="font-size:11.5px;color:var(--text-muted)">${(it.bytes/1024).toFixed(1)} KB · ${pct}%</span></div>
        <div class="progress-track" style="margin-top:4px"><div class="progress-fill" style="width:${pct}%;background:${pct>80?'var(--danger)':'var(--accent-2)'}"></div></div>
        ${it.channelId? `<button class="link-btn" style="margin-top:4px" data-archive="${it.channelId}">Archivar mensajes de más de 60 días</button>`:''}
      </div>`;
    }).join('')}
    <div class="modal-actions"><button class="btn ghost" id="stClose">Cerrar</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('stClose').addEventListener('click', closeModal);
  document.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click', async ()=>{
    const chId = b.dataset.archive;
    if(!confirm('¿Archivar mensajes de más de 60 días en este canal? No se eliminan, se guardan aparte y dejan de mostrarse en el chat activo.')) return;
    const msgs = await pGetFresh('messages:'+chId, messagesCache[chId]||[], []);
    const cutoff = Date.now() - 60*24*60*60*1000;
    const keep = msgs.filter(m=>m.ts>=cutoff);
    const archive = msgs.filter(m=>m.ts<cutoff);
    if(archive.length===0){ alert('No hay mensajes tan antiguos en este canal.'); return; }
    const monthKey = new Date().toISOString().slice(0,7);
    const archiveKey = 'messages_archive:'+chId+':'+monthKey;
    const existingArchive = await pGet(archiveKey, []);
    const archivedOk = await pSetCritical(archiveKey, existingArchive.concat(archive));
    if(!archivedOk){
      alert('No se pudo archivar por un problema de conexión — tus mensajes NO se tocaron. Intenta de nuevo en un momento.');
      return;
    }
    const keptOk = await pSetChecked('messages:'+chId, keep, 'archivado de mensajes');
    if(!keptOk){
      alert('Los mensajes ya se archivaron correctamente, pero no se pudo actualizar el canal activo todavía — vuelve a intentar el archivado para que desaparezcan del chat visible (no se perdió nada).');
      return;
    }
    messagesCache[chId] = keep;
    logActivity('canal_archivado', `Archivó ${archive.length} mensaje(s) antiguos de un canal`, null);
    alert(`Se archivaron ${archive.length} mensaje(s).`);
    closeModal();
  }));
}

function downloadJson(data, filenameBase){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `${filenameBase}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

      renderMain();
    });
    const dmList = document.getElementById('dmContactList');
    dmList.innerHTML = dmContacts.map(r=>{
      const msgs = dmCache[r.username]||[];
      const lastRead = reads['dm:'+r.username]||0;
      const unread = msgs.some(m=>m.ts>lastRead && m.from!==me?.name);
      return `<div class="side-item ${currentDMWith===r.username?'active':''} ${unread?'unread':''}" data-dm="${esc(r.username)}">
        <span class="dot"></span><span class="mini-av" style="background:${r.color};margin:0 6px 0 0">${initials(r.name)}</span>${esc(r.name)}
      </div>`;
    }).join('') || `<div class="empty">No hay otros miembros todavía</div>`;
    dmList.querySelectorAll('[data-dm]').forEach(el=>el.addEventListener('click', async ()=>{
      currentDMWith = el.dataset.dm;
      reads['dm:'+currentDMWith] = Date.now();
      await sSet('reads', reads, false);
      await loadDM(currentDMWith, true);
      renderSideOnly();
      renderMain();
      document.getElementById('side').classList.remove('show');
    }));
  } else if(view==='tasks'){
    side.innerHTML = header + `
      <div class="sub" style="padding:0 16px 8px">Tareas</div>
      <div style="padding:0 16px;color:var(--text-muted);font-size:12.5px;line-height:1.6">
        Organiza el trabajo de este proyecto por estado. Asigna responsable, prioridad y fecha límite, y enlaza cada tarea a una meta si corresponde.
      </div>`;
    wireProjectSwitcher();
  } else if(view==='goals'){
    side.innerHTML = header + `
      <div class="sub" style="padding:0 16px 8px">Metas</div>
      <div style="padding:0 16px;color:var(--text-muted);font-size:12.5px;line-height:1.6">
        Define objetivos de este proyecto con encargado y resultados clave. El progreso se puede ajustar a mano.
      </div>`;
    wireProjectSwitcher();
  } else if(view==='calendar'){
    side.innerHTML = header + `
      <div class="sub" style="padding:0 16px 8px">Calendario</div>
      <div style="padding:0 16px;color:var(--text-muted);font-size:12.5px;line-height:1.6">
        Haz clic en cualquier día para ver o agregar eventos de este proyecto.
      </div>`;
    wireProjectSwitcher();
  } else if(view==='team'){
    const proj = currentProject();
    side.innerHTML = header + `<div class="sub" style="padding:0 16px 8px">${projectMembers(proj).length} miembro(s) en este proyecto</div>`;
    wireProjectSwitcher();
  } else if(view==='activity'){
    side.innerHTML = header + `
      <div class="sub" style="padding:0 16px 8px">Actividad</div>
      <div style="padding:0 16px;color:var(--text-muted);font-size:12.5px;line-height:1.6">
        Quién hizo qué y cuándo en este proyecto. No incluye cada mensaje de chat, solo eliminaciones.
      </div>`;
    wireProjectSwitcher();
  }
}

/* ---------------- main router ---------------- */
function renderMain(isPoll){
  if(view==='dashboard') return renderDashboard();
  if(view==='chat') return renderChat(isPoll);
  if(view==='tasks') return renderTasks();
  if(view==='goals') return renderGoals();
  if(view==='calendar') return renderCalendar();
  if(view==='team') return renderTeam();
  if(view==='activity') return renderActivity();
}

  top.innerHTML = `${menuToggleHtml()}<h2>Resumen · ${esc(proj?.name||'')}</h2><div class="meta">${fmtLongDate(new Date())}</div>`;

        <div style="font-size:11.5px;color:var(--text-muted);font-weight:700">PROGRESO PROMEDIO DE METAS</div>
        <div style="font-size:26px;font-weight:800;margin:6px 0 4px">${avgGoalProgress}%</div>
        <div class="progress-track"><div class="progress-fill" style="width:${avgGoalProgress}%"></div></div>
      </div>
      <div class="card">
        <div style="font-size:11.5px;color:var(--text-muted);font-weight:700">TAREAS VENCIDAS</div>
        <div style="font-size:26px;font-weight:800;margin:6px 0 4px;color:${overdue.length?'var(--danger)':'var(--text)'}">${overdue.length}</div>
        <div style="font-size:12px;color:var(--text-muted)">sin completar y con fecha pasada</div>
      </div>
      <div class="card">
        <div style="font-size:11.5px;color:var(--text-muted);font-weight:700">EQUIPO EN LÍNEA</div>
        <div style="font-size:26px;font-weight:800;margin:6px 0 4px">${onlineCount}/${members.length}</div>
        <div style="font-size:12px;color:var(--text-muted)">activos ahora mismo</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start">
      <div>
        <h3 style="font-size:13px;color:var(--text-muted);margin:0 0 10px">Tareas por estado</h3>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
          ${STATUSES.map(s=>{

        <div style="display:flex;flex-direction:column;gap:10px">
          ${projGoals.length? projGoals.slice(0,4).map(g=>`

      <div>
        <h3 style="font-size:13px;color:var(--text-muted);margin:0 0 10px">Próximos eventos</h3>

/* ================= GLOBAL SEARCH ================= */
async function openGlobalSearchModal(){
  const accessibleIds = new Set(myProjects().map(p=>p.id));
  const html = `
    <h3>Buscar en tus proyectos</h3>
    <div class="lead">Solo busca dentro de los proyectos a los que tienes acceso.</div>
    <div class="field"><input type="text" id="gsInput" placeholder="Escribe para buscar mensajes, tareas, metas y eventos..." autofocus></div>
    <div id="gsResults" style="max-height:50vh;overflow-y:auto"></div>
    <div class="modal-actions"><button class="btn ghost" id="gsClose">Cerrar</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('gsClose').addEventListener('click', closeModal);
  const input = document.getElementById('gsInput');
  input.focus();
  let allChannels = (await pGet('channels', channels)).filter(c=>accessibleIds.has(c.projectId));
  const allMsgsByChannel = {};
  for(const c of allChannels){ allMsgsByChannel[c.id] = await pGet('messages:'+c.id, []); }
  const allTasks = (await pGet('tasks', tasks)).filter(t=>accessibleIds.has(t.projectId));
  const allGoals = (await pGet('goals', goals)).filter(g=>accessibleIds.has(g.projectId));
  const allEvents = (await pGet('events', events)).filter(e=>accessibleIds.has(e.projectId));

  function runSearch(q){
    const results = document.getElementById('gsResults');
    if(!q || q.trim().length<2){ results.innerHTML = '<div class="empty" style="padding:16px 0">Escribe al menos 2 letras...</div>'; return; }
    const ql = q.toLowerCase();
    const msgHits = [];
    allChannels.forEach(c=>{
      (allMsgsByChannel[c.id]||[]).forEach(m=>{
        if(m.text.toLowerCase().includes(ql) || m.author.toLowerCase().includes(ql)){
          msgHits.push({...m, channelId:c.id, channelName:c.name, projectId:c.projectId});
        }
      });
    });
    const taskHits = allTasks.filter(t=>(t.title+' '+(t.description||'')+' '+(t.assignee||'')).toLowerCase().includes(ql));
    const goalHits = allGoals.filter(g=>(g.title+' '+(g.description||'')).toLowerCase().includes(ql));
    const eventHits = allEvents.filter(e=>(e.title+' '+(e.description||'')).toLowerCase().includes(ql));
    const total = msgHits.length+taskHits.length+goalHits.length+eventHits.length;
    if(total===0){ results.innerHTML = '<div class="empty" style="padding:16px 0">Sin resultados.</div>'; return; }
    results.innerHTML = `
      ${msgHits.length? `<div class="hint" style="margin:10px 0 4px">Mensajes (${msgHits.length})</div>` + msgHits.slice(0,8).map(m=>`
        <div class="side-item" data-gopath="chat|${m.channelId}|${m.projectId}" style="align-items:flex-start;flex-direction:column;gap:2px">
          <span style="font-weight:700;color:var(--text)">#${esc(m.channelName)} · ${esc(m.author)}</span>
          <span style="font-size:12px">${esc(m.text.slice(0,90))}</span>
        </div>`).join('') : ''}
      ${taskHits.length? `<div class="hint" style="margin:10px 0 4px">Tareas (${taskHits.length})</div>` + taskHits.slice(0,8).map(t=>`
        <div class="side-item" data-gopath="tasks||${t.projectId}" style="flex-direction:column;align-items:flex-start;gap:2px">
          <span style="font-weight:700;color:var(--text)">${esc(t.title)}</span>
          <span style="font-size:12px">${esc(t.assignee||'Sin asignar')} · ${STATUSES.find(s=>s.v===t.status)?.l}</span>
        </div>`).join('') : ''}
      ${goalHits.length? `<div class="hint" style="margin:10px 0 4px">Metas (${goalHits.length})</div>` + goalHits.slice(0,8).map(g=>`
        <div class="side-item" data-gopath="goals||${g.projectId}" style="flex-direction:column;align-items:flex-start;gap:2px">
          <span style="font-weight:700;color:var(--text)">${esc(g.title)}</span>
          <span style="font-size:12px">${g.progress||0}% completado</span>
        </div>`).join('') : ''}
      ${eventHits.length? `<div class="hint" style="margin:10px 0 4px">Eventos (${eventHits.length})</div>` + eventHits.slice(0,8).map(e=>`
        <div class="side-item" data-gopath="calendar||${e.projectId}" style="flex-direction:column;align-items:flex-start;gap:2px">
          <span style="font-weight:700;color:var(--text)">${esc(e.title)}</span>
          <span style="font-size:12px">${esc(e.date)}${e.time? ' · '+esc(e.time):''}</span>
        </div>`).join('') : ''}
    `;
    results.querySelectorAll('[data-gopath]').forEach(el=>el.addEventListener('click', async ()=>{
      const [target, chId, projId] = el.dataset.gopath.split('|');
      if(projId && projId!==currentProjectId) currentProjectId = projId;
      if(target==='chat' && chId) currentChannelId = chId;
      view = target;
      closeModal();
      if(target==='chat' && chId) await loadChannelMessages(chId);
      renderShell(); renderMain();
    }));
  }
  input.addEventListener('input', ()=>runSearch(input.value));
}
function fmtLongDate(d){
  return d.toLocaleDateString('es',{weekday:'long', day:'numeric', month:'long'});
}

/* ================= CHAT ================= */
function renderChat(isPoll){
  if(currentDMWith) return renderDMThread(isPoll);
  const projChannels = channels.filter(c=>c.projectId===currentProjectId);
  const ch = projChannels.find(c=>c.id===currentChannelId) || projChannels[0];
  if(!ch){
    const top = document.getElementById('topbar');
    top.innerHTML = `${menuToggleHtml()}<h2>Chat</h2>`;
    wireMenuToggle();
    document.getElementById('content').innerHTML = '<div class="empty">Este proyecto todavía no tiene canales. Crea uno desde el panel lateral.</div>';
    return;
  }
  const top = document.getElementById('topbar');
  top.innerHTML = `
    ${menuToggleHtml()}
    <h2># ${esc(ch?.name||'')}</h2>
    <div class="meta">${projectMembers(currentProject()).length} miembro(s)</div>
    <div class="grow"></div>
    <input class="searchbox" id="chatSearch" placeholder="Buscar en el canal..." value="${esc(chatSearch)}">
  `;
  wireMenuToggle();
  document.getElementById('chatSearch').addEventListener('input', e=>{ chatSearch = e.target.value; renderChat(); });

  const all = (messagesCache[ch.id]||[]).slice().sort((a,b)=>a.ts-b.ts);
  const msgs = chatSearch ? all.filter(m=>m.text.toLowerCase().includes(chatSearch.toLowerCase()) || m.author.toLowerCase().includes(chatSearch.toLowerCase())) : all;
  const pinned = all.filter(m=>m.pinned);
  const content = document.getElementById('content');

  // While the background sync (isPoll) re-renders and the same channel is already open with its
  // composer in place, only refresh the message list — rebuilding the composer would wipe out
  // whatever the person is mid-typing. Full rebuilds only happen on an actual channel switch,
  // sending, reacting, etc. (explicit user actions), never on a routine background refresh.
  const canPartialUpdate = isPoll && content.dataset.channelId===ch.id && document.getElementById('msgInput');
  if(canPartialUpdate){
    const pinnedBar = content.querySelector('.pinned-bar');
    if(pinnedBar){
      pinnedBar.className = `pinned-bar ${pinned.length?'show':''}`;
      pinnedBar.innerHTML = `<b>📌 Fijados:</b>
        ${pinned.map(m=>`<span class="pin-chip">${esc(m.author)}: ${esc(m.text.slice(0,40))}${m.text.length>40?'…':''}<button data-unpin="${m.id}">✕</button></span>`).join('')}`;
    }
    const msgList = document.getElementById('msgList');
    const nearBottom = content.scrollHeight - content.scrollTop - content.clientHeight < 80;
    msgList.innerHTML = msgs.length? msgs.map(renderMsg).join('') : '<div class="empty">Aún no hay mensajes en este canal. ¡Escribe el primero!</div>';
    wireMessageButtons(content, ch, all);
    if(nearBottom) content.scrollTop = content.scrollHeight;
    return;
  }

  content.dataset.channelId = ch.id;
  content.innerHTML = `
    <div class="pinned-bar ${pinned.length?'show':''}">
      <b>📌 Fijados:</b>
      ${pinned.map(m=>`<span class="pin-chip">${esc(m.author)}: ${esc(m.text.slice(0,40))}${m.text.length>40?'…':''}<button data-unpin="${m.id}">✕</button></span>`).join('')}
    </div>
    <div class="msg-list" id="msgList">
      ${msgs.length? msgs.map(renderMsg).join('') : '<div class="empty">Aún no hay mensajes en este canal. ¡Escribe el primero!</div>'}
    </div>
    <div class="composer">
      ${replyContext? `<div class="reply-banner"><span>Respondiendo a <b>${esc(replyContext.author)}</b>: ${esc(replyContext.text.slice(0,60))}</span><span class="grow"></span><button class="btn ghost small" id="cancelReply">✕</button></div>`:''}
      <div class="mention-pop" id="mentionPop"></div>
      <div class="composer-box ${replyContext?'attached':''}">
        <textarea id="msgInput" rows="1" placeholder="Escribe un mensaje... usa @ para mencionar, **negrita**, *cursiva*, \`código\`"></textarea>
        <div class="emoji-quick">
          <button data-fmt="bold" title="Negrita"><b>B</b></button>
          <button data-fmt="italic" title="Cursiva"><i>I</i></button>
          <button data-fmt="code" title="Código" style="font-family:monospace">&lt;/&gt;</button>
        </div>
        <div class="emoji-quick">${EMOJIS.map(e=>`<button data-quick="${e}" title="Insertar">${e}</button>`).join('')}</div>
        <button class="btn primary" id="sendBtn">Enviar</button>
      </div>
    </div>
  `;
  content.scrollTop = content.scrollHeight;
  wireMessageButtons(content, ch, all);

  const cancelReply = document.getElementById('cancelReply');
  if(cancelReply) cancelReply.addEventListener('click', ()=>{ replyContext=null; renderChat(); });

  const input = document.getElementById('msgInput');
  const mentionPop = document.getElementById('mentionPop');
  input.addEventListener('input', ()=>{
    const val = input.value;
    const at = val.lastIndexOf('@');
    if(at>-1 && (at===0 || /\s/.test(val[at-1])) && !/\s/.test(val.slice(at+1))){
      const q = val.slice(at+1).toLowerCase();
      const matches = roster.filter(r=>r.name.toLowerCase().includes(q));
      if(matches.length){
        mentionPop.innerHTML = matches.map(m=>`<div data-pick="${esc(m.name)}">${esc(m.name)}</div>`).join('');
        mentionPop.classList.add('show');
        mentionPop.querySelectorAll('[data-pick]').forEach(d=>d.addEventListener('click', ()=>{
          input.value = val.slice(0,at)+'@'+d.dataset.pick+' ';
          mentionPop.classList.remove('show');
          input.focus();
        }));
      } else mentionPop.classList.remove('show');
    } else mentionPop.classList.remove('show');
    input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px';
  });
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(ch.id); }
  });
  document.getElementById('sendBtn').addEventListener('click', ()=>sendMessage(ch.id));
  content.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click', ()=>{
    input.value += b.dataset.quick; input.focus();
  }));
  const FMT_MARKS = {bold:['**','**'], italic:['*','*'], code:['`','`']};
  content.querySelectorAll('[data-fmt]').forEach(b=>b.addEventListener('click', ()=>{
    const [before,after] = FMT_MARKS[b.dataset.fmt];
    wrapSelection(input, before, after);
  }));
}
function wireMessageButtons(content, ch, all){
  content.querySelectorAll('[data-unpin]').forEach(b=>b.addEventListener('click', ()=>togglePin(ch.id,b.dataset.unpin,false)));
  content.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click', ()=>togglePin(ch.id,b.dataset.pin,true)));
  content.querySelectorAll('[data-reply]').forEach(b=>b.addEventListener('click', ()=>{
    const m = all.find(x=>x.id===b.dataset.reply);

async function sendDM(){
  const input = document.getElementById('dmInput');
  const text = input.value.trim();
  if(!text || !currentDMWith) return;
  const other = currentDMWith;
  const key = dmKeyFor(other);
  const msgs = await pGetFresh(key, dmCache[other]||[], []);
  msgs.push({id:uid(), from:me.name, text, ts:Date.now()});
  if(!(await pSetChecked(key, msgs, 'mensaje directo'))) return;
  dmCache[other] = msgs;
  reads['dm:'+other] = Date.now();
  await sSet('reads', reads, false);
  input.value = '';
  renderChat();
}
async function deleteDMMessage(msgId){
  const other = currentDMWith;
  let msgs = await pGetFresh(dmKeyFor(other), dmCache[other]||[], []);
  msgs = msgs.filter(x=>x.id!==msgId);

  renderChat();
