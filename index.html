async function sendMessage(chId){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  const msgs = await pGetFresh('messages:'+chId, messagesCache[chId]||[], []);
  msgs.push({
    id:uid(), author:me.name, text, ts:Date.now(),
    reactions:{}, pinned:false,
    quote: replyContext ? {author:replyContext.author, text:replyContext.text} : null
  });
  if(!(await pSetChecked('messages:'+chId, msgs, 'mensaje'))) return;
  messagesCache[chId] = msgs;
  reads[chId] = Date.now();
  await sSet('reads', reads, false);
  input.value=''; replyContext=null;
  renderChat();
}
async function toggleReaction(chId, msgId, emoji){
  const msgs = await pGetFresh('messages:'+chId, messagesCache[chId]||[], []);
  const m = msgs.find(x=>x.id===msgId); if(!m) return;
  m.reactions = m.reactions||{};
  m.reactions[emoji] = m.reactions[emoji]||[];
  const i = m.reactions[emoji].indexOf(me.name);
  if(i>-1) m.reactions[emoji].splice(i,1); else m.reactions[emoji].push(me.name);
  if(!(await pSetChecked('messages:'+chId, msgs, 'reacción'))) return;
  messagesCache[chId]=msgs; renderChat();
}
async function togglePin(chId, msgId, val){
  const msgs = await pGetFresh('messages:'+chId, messagesCache[chId]||[], []);
  const m = msgs.find(x=>x.id===msgId); if(!m) return;
  m.pinned = val;
  if(!(await pSetChecked('messages:'+chId, msgs, 'mensaje fijado'))) return;
  messagesCache[chId]=msgs; renderChat();
}
async function deleteMsg(chId, msgId){
  let msgs = await pGetFresh('messages:'+chId, messagesCache[chId]||[], []);
  const removed = msgs.find(x=>x.id===msgId);
  msgs = msgs.filter(x=>x.id!==msgId);
  if(!(await pSetChecked('messages:'+chId, msgs, 'eliminación de mensaje'))) return;
  const ch = channels.find(c=>c.id===chId);
  logActivity('mensaje_eliminado', `Eliminó un mensaje en #${ch?.name||''}: "${(removed?.text||'').slice(0,60)}"`);
  messagesCache[chId]=msgs; renderChat();
}

  const content = document.getElementById('content');
  content.innerHTML = `<div class="task-cols">
    ${STATUSES.map(s=>`
      <div class="task-col">
        <h3>${s.l} <span>${projTasks.filter(t=>t.status===s.v).length}</span></h3>
        <div class="task-col-list" data-coldrop="${s.v}">
          ${projTasks.filter(t=>t.status===s.v).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(renderTaskCard).join('') || '<div class="empty" style="padding:16px">Sin tareas</div>'}
        </div>

    `).join('')}

  content.querySelectorAll('[data-taskstatus]').forEach(sel=>sel.addEventListener('change', ()=>changeTaskStatus(sel.dataset.taskstatus, sel.value)));
  content.querySelectorAll('[data-taskdel]').forEach(b=>b.addEventListener('click', async ()=>{
    const backup = tasks;
    const removed = tasks.find(x=>x.id===b.dataset.taskdel);
    tasks = tasks.filter(x=>x.id!==b.dataset.taskdel);
    if(!(await pSetChecked('tasks', tasks, 'eliminación de tarea'))){ tasks = backup; return; }
    logActivity('tarea_eliminada', `Eliminó la tarea "${removed?.title||''}"`);
    renderTasks();
  }));
  content.querySelectorAll('[data-subtoggle]').forEach(cb=>cb.addEventListener('change', async ()=>{
    const [tid,idx] = cb.dataset.subtoggle.split('|');
    const t = tasks.find(x=>x.id===tid);
    const prev = t.subtasks[+idx].done;
    t.subtasks[+idx].done = cb.checked;
    if(!(await pSetChecked('tasks', tasks, 'subtarea'))){ t.subtasks[+idx].done = prev; return; }
    renderTasks();
  }));

  content.querySelectorAll('[data-taskid]').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.taskid);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
  });
  content.querySelectorAll('[data-coldrop]').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.style.background='var(--surface-2)'; });
    col.addEventListener('dragleave', ()=>{ col.style.background=''; });
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.style.background='';
      const tid = e.dataTransfer.getData('text/plain');
      if(tid) changeTaskStatus(tid, col.dataset.coldrop);
    });
  });
}

function nextRecurrenceDate(dueStr, recurrence){
  const d = dueStr ? new Date(dueStr+'T00:00:00') : new Date();
  if(recurrence==='daily') d.setDate(d.getDate()+1);
  else if(recurrence==='weekly') d.setDate(d.getDate()+7);
  else if(recurrence==='monthly') d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}

async function changeTaskStatus(taskId, newStatus){
  const t = tasks.find(x=>x.id===taskId);
  if(!t) return;
  if(newStatus!=='todo' && t.dependsOn){
    const dep = tasks.find(x=>x.id===t.dependsOn);
    if(dep && dep.status!=='done'){
      alert(`Esta tarea depende de "${dep.title}", que todavía no está completada.`);
      renderTasks();
      return;
    }
  }
  const prev = t.status;
  t.status = newStatus;
  let newOccurrence = null;
  if(newStatus==='done' && t.recurrence && t.recurrence!=='none'){
    newOccurrence = {
      ...t, id:uid(), status:'todo', due:nextRecurrenceDate(t.due, t.recurrence),
      subtasks:(t.subtasks||[]).map(s=>({text:s.text, done:false})),
      createdAt:Date.now()
    };
  }
  if(newOccurrence) tasks.push(newOccurrence);
  if(!(await pSetChecked('tasks', tasks, 'cambio de estado de tarea'))){ t.status = prev; if(newOccurrence) tasks.pop(); renderTasks(); return; }
  logActivity('tarea_estado', `Cambió "${t.title}" a ${STATUSES.find(s=>s.v===t.status)?.l}`);
  if(newOccurrence) logActivity('tarea_creada', `Se generó automáticamente la siguiente repetición de "${t.title}"`);
  renderTasks();
}
function renderTaskCard(t){
  const pr = PRIORITIES.find(p=>p.v===t.priority)||PRIORITIES[1];
  const goal = goals.find(g=>g.id===t.goalId);
  const dep = tasks.find(x=>x.id===t.dependsOn);
  const depBlocked = dep && dep.status!=='done';
  const subtasks = t.subtasks||[];
  const subDone = subtasks.filter(s=>s.done).length;
  const REC_LABELS = {none:'', daily:'🔁 Diaria', weekly:'🔁 Semanal', monthly:'🔁 Mensual'};
  return `<div class="card" draggable="true" data-taskid="${t.id}">
    <div class="card-title">${esc(t.title)}</div>
    ${t.description? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${esc(t.description)}</div>`:''}
    <div class="card-row">
      <span class="badge ${pr.c}">${pr.l}</span>
      ${t.due? `<span class="due">📅 ${esc(t.due)}</span>`:'<span></span>'}
    </div>
    <div class="card-row">
      <span class="who"><span class="av" style="background:${colorFor(t.assignee)}">${initials(t.assignee||'?')}</span>${esc(t.assignee||'Sin asignar')}</span>
      ${t.team? `<span class="team-tag">${esc(t.team)}</span>`:''}
    </div>
    ${t.members&&t.members.length? `<div style="display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--text-muted)">Con:</span>
      ${t.members.map(m=>`<span class="av" style="width:20px;height:20px;font-size:9px;background:${colorFor(m)}" title="${esc(m)}">${initials(m)}</span>`).join('')}
    </div>`:''}
    ${t.recurrence && t.recurrence!=='none'? `<div style="font-size:11px;color:var(--accent-2);margin-top:6px">${REC_LABELS[t.recurrence]}</div>`:''}
    ${dep? `<div style="font-size:11px;margin-top:6px;color:${depBlocked?'var(--danger)':'var(--accent-2)'}">⛓ depende de: ${esc(dep.title)}${depBlocked?' (pendiente)':' (lista)'}</div>`:''}
    ${subtasks.length? `<div style="margin-top:8px">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Subtareas ${subDone}/${subtasks.length}</div>
      ${subtasks.map((s,i)=>`<div class="kr ${s.done?'done':''}" style="padding:3px 0;border-top:none"><input type="checkbox" ${s.done?'checked':''} data-subtoggle="${t.id}|${i}"><span style="font-size:12px">${esc(s.text)}</span></div>`).join('')}
    </div>`:''}
    <div class="card-row">
      <select data-taskstatus="${t.id}">${STATUSES.map(s=>`<option value="${s.v}" ${s.v===t.status?'selected':''}>${s.l}</option>`).join('')}</select>
      <button class="card-del" data-taskdel="${t.id}">Eliminar</button>
    </div>
    ${goal? `<div class="card-goal">🎯 ${esc(goal.title)}</div>`:''}
  </div>`;
}

    <div style="margin-top:10px;text-align:right"><button class="card-del" data-goaldel="${g.id}">Eliminar meta</button></div>
  </div>`;
}

    <div class="field"><label>Título</label><input type="text" id="gTitle"></div>

    <div class="field"><label>Encargado/a</label><select id="gOwner"><option value="">Sin asignar</option>${members.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Equipo / área</label><input type="text" id="gTeam"></div>
    <div class="field"><label>Fecha objetivo</label><input type="date" id="gDue"></div>
    <div class="field check"><input type="checkbox" id="gShowCal" checked><label for="gShowCal">Mostrar en el calendario</label></div>
    <div class="field"><label>Resultados clave (uno por línea)</label><textarea id="gKr" placeholder="Ej. Publicar 4 boletines&#10;Capacitar a 20 personas"></textarea></div>
    <div class="modal-actions"><button class="btn ghost" id="gCancel">Cancelar</button><button class="btn primary" id="gSave">Crear meta</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('gCancel').addEventListener('click', closeModal);
  document.getElementById('gSave').addEventListener('click', async ()=>{

    goals.push({

}

/* ================= CALENDAR ================= */
function renderCalendar(){
  const top = document.getElementById('topbar');
  top.innerHTML = `${menuToggleHtml()}<h2>Calendario</h2>`;
  wireMenuToggle();
  const content = document.getElementById('content');

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = new Date(year, month, i-startOffset+1);
    cells.push({date:d, other:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({date:new Date(year,month,d), other:false});
  while(cells.length%7!==0 || cells.length<42) cells.push({date:new Date(year,month,daysInMonth+cells.length-startOffset-daysInMonth+1), other:true});

  function evsFor(d){
    const key = d.toISOString().slice(0,10);
    const realEvents = events.filter(e=>e.date===key && e.projectId===currentProjectId)
      .map(e=>({kind:'event', icon:'📅', title:e.title, sortKey:e.time||''}));
    const dueTasks = tasks.filter(t=>t.due===key && t.projectId===currentProjectId && t.showOnCalendar!==false && t.status!=='done')
      .map(t=>({kind:'task', icon:'📋', title:t.title, sortKey:''}));
    const dueGoals = goals.filter(g=>g.due===key && g.projectId===currentProjectId && g.showOnCalendar!==false)
      .map(g=>({kind:'goal', icon:'🎯', title:g.title, sortKey:''}));
    return [...realEvents, ...dueTasks, ...dueGoals];
  }
  const upcoming = events.filter(e=>e.projectId===currentProjectId && e.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);

  content.innerHTML = `<div class="cal-wrap">
    <div class="cal-grid">
      <div class="cal-nav">
        <button class="btn ghost" id="prevM">‹</button>
        <h3>${MONTHS[month]} ${year}</h3>
        <button class="btn ghost" id="nextM">›</button>
      </div>
      <div class="cal-days">${DAYS.map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-cells">
        ${cells.map(c=>{
          const evs = evsFor(c.date);
          return `<div class="cal-cell ${c.other?'other':''} ${isToday(c.date)?'today':''}" data-day="${c.date.toISOString().slice(0,10)}">
            <div class="n">${c.date.getDate()}</div>
            ${evs.slice(0,3).map(e=>`<div class="ev-chip ${e.kind!=='event'?'ev-chip-'+e.kind:''}">${e.icon} ${esc(e.title)}</div>`).join('')}
            ${evs.length>3? `<div style="font-size:10px;color:var(--text-muted);margin-top:2px">+${evs.length-3} más</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:14px;padding:10px 16px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border)">
        <span>📅 Eventos</span><span>📋 Tareas con fecha</span><span>🎯 Metas con fecha</span>
      </div>
    </div>
    <div class="agenda">
      <h3>Próximos eventos</h3>
      ${upcoming.length? upcoming.map(e=>`
        <div class="agenda-item">
          <div class="d">${fmtDateShort(new Date(e.date+'T00:00:00').getTime())}${e.time? ' · '+e.time:''}</div>
          <div class="t">${esc(e.title)}</div>
          ${e.attendees?.length? `<div class="a">${e.attendees.map(esc).join(', ')}</div>`:'<div class="a">👥 Todo el proyecto</div>'}
        </div>
      `).join('') : '<div class="empty">Sin eventos próximos</div>'}
    </div>
  </div>`;

  document.getElementById('prevM').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); });
  document.getElementById('nextM').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); });
  content.querySelectorAll('[data-day]').forEach(cell=>cell.addEventListener('click', ()=>openDayModal(cell.dataset.day)));
}
function openDayModal(dateKey){
  const dayEvents = events.filter(e=>e.date===dateKey && e.projectId===currentProjectId);
  const members = projectMembers(currentProject());
  let editingEventId = null;
  const html = `
    <h3>${new Date(dateKey+'T00:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</h3>
    <div id="dayEvList">
      ${dayEvents.length? dayEvents.map(e=>`
        <div class="card" style="margin-bottom:8px">
          <div class="card-title">${esc(e.title)}${e.time? ' · '+esc(e.time):''}</div>
          ${e.description? `<div style="font-size:12px;color:var(--text-muted)">${esc(e.description)}</div>`:''}
          ${e.attendees?.length? `<div style="font-size:11.5px;color:var(--text-muted);margin-top:6px">👥 ${e.attendees.map(esc).join(', ')}</div>`:''}
          <div style="text-align:right;margin-top:6px;display:flex;justify-content:flex-end;gap:10px">
            <button class="link-btn" data-evedit="${e.id}">Editar</button>
            <button class="card-del" data-evdel="${e.id}">Eliminar</button>
          </div>
        </div>
      `).join('') : '<div class="empty" style="padding:10px 0">Sin eventos este día</div>'}
    </div>
    <hr style="border-color:var(--border);margin:14px 0">
    <div id="eFormTitle" style="font-size:12.5px;color:var(--text-muted);font-weight:700;margin-bottom:8px">Nuevo evento</div>
    <div class="field"><label>Título del evento</label><input type="text" id="eTitle"></div>
    <div class="field"><label>Hora (opcional)</label><input type="time" id="eTime"></div>
    <div class="field"><label>Descripción</label><textarea id="eDesc"></textarea></div>
    <div class="field"><label>Participantes (deja vacío para notificar a todo el proyecto)</label><div class="chip-select" id="eAttendees">${members.map(r=>`<button type="button" class="chip-opt" data-v="${esc(r.name)}">${esc(r.name)}</button>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn ghost" id="eCancelEdit" style="display:none">Cancelar edición</button><button class="btn ghost" id="eCancel">Cerrar</button><button class="btn primary" id="eSave">Agregar evento</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  let picked = new Set();
  const titleInput = document.getElementById('eTitle');
  const timeInput = document.getElementById('eTime');
  const descInput = document.getElementById('eDesc');
  const saveBtn = document.getElementById('eSave');
  const formTitle = document.getElementById('eFormTitle');
  const cancelEditBtn = document.getElementById('eCancelEdit');

  function wireChips(){
    document.querySelectorAll('#eAttendees .chip-opt').forEach(b=>{
      b.classList.toggle('sel', picked.has(b.dataset.v));
      b.onclick = ()=>{
        b.classList.toggle('sel');
        if(picked.has(b.dataset.v)) picked.delete(b.dataset.v); else picked.add(b.dataset.v);
      };
    });
  }
  function resetForm(){
    editingEventId = null;
    titleInput.value=''; timeInput.value=''; descInput.value='';
    picked = new Set();
    wireChips();
    saveBtn.textContent = 'Agregar evento';
    formTitle.textContent = 'Nuevo evento';
    cancelEditBtn.style.display = 'none';
  }
  wireChips();
  document.getElementById('eCancel').addEventListener('click', closeModal);
  cancelEditBtn.addEventListener('click', resetForm);

  document.querySelectorAll('[data-evedit]').forEach(b=>b.addEventListener('click', ()=>{
    const ev = dayEvents.find(x=>x.id===b.dataset.evedit);
    if(!ev) return;
    editingEventId = ev.id;
    titleInput.value = ev.title;
    timeInput.value = ev.time || '';
    descInput.value = ev.description || '';
    picked = new Set(ev.attendees||[]);
    wireChips();
    saveBtn.textContent = 'Guardar cambios';
    formTitle.textContent = 'Editando: '+ev.title;
    cancelEditBtn.style.display = '';
    titleInput.focus();
  }));

  document.querySelectorAll('[data-evdel]').forEach(b=>b.addEventListener('click', async ()=>{
    const backup = events;
    const removed = events.find(x=>x.id===b.dataset.evdel);
    events = events.filter(x=>x.id!==b.dataset.evdel);
    if(!(await pSetChecked('events', events, 'eliminación de evento'))){ events = backup; return; }
    logActivity('evento_eliminado', `Eliminó el evento "${removed?.title||''}"`);
    closeModal(); renderCalendar();
  }));

  saveBtn.addEventListener('click', async ()=>{
    const title = titleInput.value.trim();
    if(!title) return;
    events = await pGetFresh('events', events);
    if(editingEventId){
      const ev = events.find(x=>x.id===editingEventId);
      if(!ev){ closeModal(); renderCalendar(); return; }
      ev.title = title; ev.time = timeInput.value; ev.description = descInput.value.trim();
      ev.attendees = [...picked];
      if(!(await pSetChecked('events', events, 'edición de evento'))) return;
      logActivity('evento_actualizado', `Editó el evento "${title}" (${dateKey})`);
      await logEventUpdate(ev, 'updated');
    } else {
      const newEv = {
        id:uid(), date:dateKey, time:timeInput.value, projectId:currentProjectId,
        title, description:descInput.value.trim(),
        attendees:[...picked], createdBy:me.name, createdAt:Date.now()
      };
      events.push(newEv);
      if(!(await pSetChecked('events', events, 'nuevo evento'))) return;
      logActivity('evento_creado', `Creó el evento "${title}" (${dateKey})`);
      await logEventUpdate(newEv, 'created');
      notifyNewEvent(newEv);
    }
    closeModal(); renderCalendar();
  });
}

/* ================= TEAM ================= */
function renderTeam(){
  const proj = currentProject();
  const members = projectMembers(proj);
  const top = document.getElementById('topbar');
  top.innerHTML = `${menuToggleHtml()}<h2>Equipo · ${esc(proj?.name||'')}</h2><div class="grow"></div>
    ${isAdmin && proj && !proj.isGeneral? `<button class="btn primary" id="addMemberBtn">+ Agregar miembro</button>`:''}
  `;
  wireMenuToggle();
  const addBtn = document.getElementById('addMemberBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>openProjectMembersModal(proj));
  const content = document.getElementById('content');
  content.innerHTML = `<div class="team-grid">
    ${members.map(r=>`
      <div class="team-card">
        <div class="av" style="background:${r.color}">${initials(r.name)}</div>
        <div style="flex:1">
          <div class="name">${esc(r.name)}${me&&r.name===me.name?' (tú)':''}</div>
          <div class="status ${isOnline(r.name)?'on':''}"><span class="sdot"></span>${isOnline(r.name)?'En línea':'Desconectado'}</div>
        </div>
        ${isAdmin && proj && !proj.isGeneral? `<button class="card-del" data-removemember="${esc(r.username||'')}">Quitar</button>`:''}
      </div>
    `).join('') || '<div class="empty">Nadie asignado a este proyecto todavía.</div>'}
  </div>`;
  content.querySelectorAll('[data-removemember]').forEach(b=>b.addEventListener('click', async ()=>{
    projects = await pGetFresh('projects', projects);
    const p = projects.find(x=>x.id===currentProjectId);
    p.members = (p.members||[]).filter(u=>u!==b.dataset.removemember);
    if(!(await pSetChecked('projects', projects, 'actualización de miembros'))) return;
    logActivity('proyecto_miembro', `Quitó a un miembro del proyecto "${p.name}"`, null);
    renderTeam();
  }));
}

function openProjectMembersModal(project){
  const currentMembers = new Set(project.members||[]);
  const candidates = Object.entries(accounts).filter(([u,a])=>a.status!=='pending' && !currentMembers.has(u));
  const html = `
    <h3>Agregar miembros a "${esc(project.name)}"</h3>
    <div class="lead">Solo las personas que agregues aquí podrán ver este proyecto.</div>
    <div id="candList">
      ${candidates.length? candidates.map(([u,a])=>`
        <div class="card-row" style="padding:8px 0;border-top:1px solid var(--border)">
          <span class="who"><span class="av" style="background:${a.color}">${initials(a.displayName)}</span>${esc(a.displayName)}</span>
          <button class="btn small primary" data-addmember="${esc(u)}">Agregar</button>
        </div>
      `).join('') : '<div class="empty">No hay más miembros del espacio para agregar.</div>'}
    </div>
    <div class="modal-actions"><button class="btn ghost" id="pmClose">Cerrar</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('pmClose').addEventListener('click', closeModal);
  document.querySelectorAll('[data-addmember]').forEach(b=>b.addEventListener('click', async ()=>{
    projects = await pGetFresh('projects', projects);
    const p = projects.find(x=>x.id===project.id);
    p.members = p.members || [];
    if(!p.members.includes(b.dataset.addmember)) p.members.push(b.dataset.addmember);
    if(!(await pSetChecked('projects', projects, 'nuevo miembro de proyecto'))) return;
    logActivity('proyecto_miembro', `Agregó a ${accounts[b.dataset.addmember]?.displayName||b.dataset.addmember} al proyecto "${p.name}"`, null);
    openProjectMembersModal(p);
  }));
}

function openNewProjectModal(){
  const html = `
    <h3>Nuevo proyecto</h3>
    <div class="lead">Solo tú y quienes agregues después podrán verlo.</div>
    <div class="field"><label>Nombre</label><input type="text" id="pName"></div>
    <div class="field"><label>Descripción</label><textarea id="pDesc"></textarea></div>
    <div class="modal-actions"><button class="btn ghost" id="pCancel">Cancelar</button><button class="btn primary" id="pSave">Crear proyecto</button></div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('pCancel').addEventListener('click', closeModal);
  document.getElementById('pSave').addEventListener('click', async ()=>{
    const name = document.getElementById('pName').value.trim();
    if(!name) return;
    projects = await pGetFresh('projects', projects);
    const newProj = {
      id:uid(), name, description:document.getElementById('pDesc').value.trim(),
      isGeneral:false, members:[currentUsername], createdBy:me.name, createdAt:Date.now()
    };
    projects.push(newProj);
    if(!(await pSetChecked('projects', projects, 'nuevo proyecto'))) return;
    channels = await pGetFresh('channels', channels);
    channels.push({id:uid(), name:'general', projectId:newProj.id});
    await pSet('channels', channels);
    logActivity('proyecto_creado', `Creó el proyecto "${name}"`, null);
    closeModal();
    await switchProject(newProj.id);
  });
}
