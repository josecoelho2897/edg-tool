    steps:
      - name: Consultar la base de datos
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "apikey: sb_publishable_wBf87sTE6FH-6PnGKGFyAQ_aVWqj5H2" \
            "https://iozmufovriszyhqhwzqa.supabase.co/rest/v1/kv_store?select=key&limit=1")
